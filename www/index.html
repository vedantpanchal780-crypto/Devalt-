<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DevVault</title>
<style>
/* Minimal local utilities (replaces Tailwind CDN; no external dependencies) */
*,*::before,*::after{box-sizing:border-box}
.flex{display:flex}.flex-col{flex-direction:column}.flex-1{flex:1 1 0%}.shrink-0{flex-shrink:0}
.items-center{align-items:center}.items-start{align-items:flex-start}.items-end{align-items:flex-end}
.justify-between{justify-content:space-between}
.gap-1{gap:4px}.gap-2{gap:8px}.gap-3{gap:12px}
.h-full{height:100%}.w-72{width:18rem}.min-w-0{min-width:0}.max-w-md{max-width:28rem}.max-h-64{max-height:16rem}
.p-3{padding:12px}.p-4{padding:16px}.px-2{padding-left:8px;padding-right:8px}.px-3{padding-left:12px;padding-right:12px}
.py-1{padding-top:4px;padding-bottom:4px}.py-2{padding-top:8px;padding-bottom:8px}.pb-2{padding-bottom:8px}
.mb-1{margin-bottom:4px}.mb-2{margin-bottom:8px}.mt-1{margin-top:4px}.mt-2{margin-top:8px}.mt-3{margin-top:12px}.ml-auto{margin-left:auto}
.space-y-3>*+*{margin-top:12px}
.overflow-y-auto{overflow-y:auto}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.text-xs{font-size:12px}.text-sm{font-size:13px}.font-medium{font-weight:500}.font-semibold{font-weight:600}
.rounded-md{border-radius:6px}.rounded-lg{border-radius:10px}
.cursor-pointer{cursor:pointer}
.fixed{position:fixed}.inset-0{inset:0}.z-20{z-index:20}.z-50{z-index:50}
.bg-black\/60{background:rgba(0,0,0,.6)}
.left-1\/2{left:50%}.bottom-6{bottom:24px}.-translate-x-1\/2{transform:translateX(-50%)}
.hidden{display:none}
@media(min-width:768px){.md\:hidden{display:none!important}}
</style>
<style>
:root{--bg:#14161a;--panel:#1b1e24;--side:#101216;--line:#2a2e37;--text:#e6e8ec;--mute:#8b92a0;--acc:#f0a53a}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,Roboto,sans-serif;font-size:14px}
*{scrollbar-width:thin;scrollbar-color:#333 transparent}
.panel{background:var(--panel);border:1px solid var(--line)}
.btn{padding:6px 10px;border-radius:6px;background:#262a33;border:1px solid var(--line);color:var(--text);cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--acc)}
.btn-acc{background:var(--acc);color:#1a1200;border-color:var(--acc);font-weight:600}
.inp{background:#0f1115;border:1px solid var(--line);border-radius:6px;color:var(--text);padding:8px 10px;width:100%;outline:none}
.inp:focus{border-color:var(--acc)}
.nav{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:6px;cursor:pointer;color:var(--mute);min-height:34px}
.nav:hover{background:#1a1d23;color:var(--text)}
.nav.on{background:#262a33;color:var(--text)}
.nav .x{margin-left:auto;opacity:0;font-size:12px}
.nav:hover .x,.nav.on .x{opacity:.7}
@media(hover:none){.nav .x{opacity:.7}}
pre.code{background:#0b0d10;border:1px solid var(--line);border-radius:6px;padding:10px;overflow-x:auto;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
code.ic{background:#0b0d10;padding:1px 5px;border-radius:4px;font:12.5px ui-monospace,Menlo,monospace;color:var(--acc)}
#side{transition:transform .2s}
@media(max-width:767px){#side{position:fixed;inset:0 auto 0 0;width:84%;max-width:320px;z-index:30;transform:translateX(-100%)}#side.open{transform:none}}
.drop{border:2px dashed var(--acc)!important;background:#2a2112}
mark{background:#6b4a10;color:#fff;border-radius:2px}
</style>
<style>
.ov{position:fixed;inset:0;z-index:40;display:flex;background:rgba(0,0,0,.55)}
.ov.hidden{display:none}
.sheetp{width:100%;max-width:520px;margin:0 auto;background:var(--panel);border-radius:18px 18px 0 0;padding:10px 10px calc(10px + env(safe-area-inset-bottom));border:1px solid var(--line)}
#sheetL{max-height:60vh;overflow-y:auto}
.sitem{display:flex;align-items:center;gap:14px;width:100%;min-height:52px;padding:0 12px;background:none;border:0;color:var(--text);font-size:16px;border-radius:10px;cursor:pointer;text-align:left}
.sitem:active,.sitem:hover{background:#262a33}.sitem.dng{color:#ff6b6b}
.ib{min-width:40px;height:40px;display:inline-grid;place-items:center;border-radius:10px;background:transparent;border:0;color:var(--text);cursor:pointer;font-size:18px}
.ib:hover{background:#262a33}.ib.sm{min-width:34px;height:34px;color:var(--mute)}.ib.sm:hover{color:var(--text)}
.dots{margin-left:auto;width:34px;height:34px;display:grid;place-items:center;color:var(--mute);border-radius:8px;flex-shrink:0}
.cbox{display:flex;align-items:flex-end;gap:6px;background:#23272f;border:1px solid var(--line);border-radius:24px;padding:6px}
.cbox textarea{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--text);resize:none;font:inherit;font-size:16px;line-height:1.45;padding:8px 4px;min-height:40px;max-height:45vh;overflow-y:auto}
.cbox textarea.big{min-height:110px}
.rb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#2f343e;border:0;color:var(--text);cursor:pointer;flex-shrink:0}
.rb.send{background:var(--acc);color:#1a1200}.rb.send:disabled{opacity:.35}
.chip{display:flex;align-items:center;gap:6px;background:#23272f;border:1px solid var(--line);border-radius:12px;padding:4px 6px;flex-shrink:0}
.chip img{width:40px;height:40px;object-fit:cover;border-radius:8px}.chip button{background:none;border:0;color:var(--mute);cursor:pointer;display:grid}
.msg{margin-bottom:14px;max-width:760px}
.bubble{background:#1f232b;border:1px solid var(--line);border-radius:6px 16px 16px 16px;padding:10px 12px;font-size:15px;display:inline-block;max-width:100%;min-width:90px}
.bubble .mt{font-size:11px;color:var(--mute);margin-top:6px;text-align:right}
.acts{display:flex;gap:2px;margin-top:2px;margin-left:4px}
.att-img{display:block;max-width:100%;max-height:260px;border-radius:10px;margin-bottom:8px;cursor:pointer;background:#0b0d10;min-height:60px}
.att-file{display:flex;align-items:center;gap:10px;background:#15181d;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;cursor:pointer;min-width:200px}
.day{text-align:center;color:var(--mute);font-size:12px;margin:10px 0 14px}
.nav{min-height:42px}
</style>
</head>

<body>
<div class="flex h-full" style="padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)">
  <div id="scrim" class="fixed inset-0 bg-black/60 z-20 hidden md:hidden" onclick="toggleSide(false)"></div>
  <aside id="side" class="flex flex-col w-72 shrink-0" style="background:var(--side);border-right:1px solid var(--line)">
    <div class="p-3 flex items-center justify-between">
      <b style="font-size:16px">DevVault</b>
      <button class="btn" onclick="addNode(null)">+ Block</button>
    </div>
    <div class="px-3 pb-2"><input id="gsearch" class="inp" placeholder="Search everything…" oninput="onSearch(this.value)"></div>
    <nav id="tree" class="flex-1 overflow-y-auto px-2 pb-2"></nav>
    <div class="p-3 flex gap-2" style="border-top:1px solid var(--line)">
      <button class="btn flex-1" onclick="exportAll()">Backup</button>
      <button class="btn flex-1" onclick="$('imp').click()">Restore</button>
      <input id="imp" type="file" accept=".json,application/json" class="hidden" onchange="importAll(this.files[0]);this.value=''">
    </div>
  </aside>
  <main class="flex-1 flex flex-col min-w-0 h-full">
    <header class="flex items-center gap-2 px-3 py-2" style="border-bottom:1px solid var(--line)">
      <button class="ib md:hidden" onclick="toggleSide(true)" aria-label="Menu">☰</button>
      <div id="title" class="font-semibold truncate flex-1 min-w-0"></div>
      <div id="hdr"></div>
    </header>
    <section id="feed" class="flex-1 overflow-y-auto p-3"></section>
    <footer id="composer" class="px-3 pb-3 pt-2">
      <div id="chips" class="flex gap-2 pb-2" style="overflow-x:auto"></div>
      <div class="cbox">
        <button class="rb" onclick="plusMenu()" aria-label="Attach"></button>
        <textarea id="input" rows="1" placeholder="Write a message…" oninput="autosize()" onfocus="this.classList.add('big');autosize()" onblur="if(!this.value)this.classList.remove('big');autosize()"></textarea>
        <button class="rb" id="bExpand" onclick="expandComposer()" aria-label="Expand"></button>
        <button class="rb send" id="bSend" onclick="sendMsg()" aria-label="Send"></button>
      </div>
      <input id="fPhoto" type="file" accept="image/*,video/*" multiple class="hidden" onchange="addPending(this.files);this.value=''">
      <input id="fCam" type="file" accept="image/*" capture="environment" class="hidden" onchange="addPending(this.files);this.value=''">
      <input id="fDoc" type="file" multiple class="hidden" onchange="addPending(this.files);this.value=''">
    </footer>
  </main>
</div>

<div id="sheet" class="ov hidden" style="align-items:flex-end" onclick="if(event.target===this)closeSheet()">
  <div class="sheetp"><div id="sheetT" class="font-semibold" style="padding:6px 8px 10px"></div><div id="sheetL"></div></div>
</div>
<div id="editor" class="ov hidden" style="flex-direction:column;background:var(--bg);z-index:60;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)">
  <div class="flex items-center gap-2 p-3" style="border-bottom:1px solid var(--line)">
    <button class="ib" onclick="closeEditor()" id="edX"></button>
    <div id="edTitle" class="font-semibold flex-1"></div>
    <button class="btn btn-acc" id="edDone" onclick="editorDone()">Done</button>
  </div>
  <textarea id="edTa" class="flex-1" style="background:transparent;border:0;outline:0;color:var(--text);padding:16px;font:inherit;font-size:16px;line-height:1.6;resize:none" placeholder="Write here…"></textarea>
</div>
<div id="viewer" class="ov hidden" style="flex-direction:column;background:#000;z-index:70" onclick="closeViewer()">
  <div class="flex justify-end gap-2 p-3"><button class="ib" id="vSave" onclick="event.stopPropagation()"></button><button class="ib" id="vX"></button></div>
  <div class="flex-1 flex items-center justify-center" style="min-height:0"><img id="vImg" style="max-width:100%;max-height:100%;object-fit:contain" alt=""></div>
</div>
<div id="toast" class="fixed left-1/2 bottom-6 -translate-x-1/2 px-3 py-2 rounded-md hidden z-50" style="background:#000;border:1px solid var(--line);z-index:90"></div>

<script>
const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STORES=['projects','channels','nodes','items','blobs'];
const ICON={
copy:'<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/>',
edit:'<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>',
trash:'<path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>',
plus:'<path d="M5 12h14M12 5v14"/>',up:'<path d="m5 12 7-7 7 7M12 19V5"/>',down:'<path d="m19 12-7 7-7-7M12 5v14"/>',
expand:'<path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/>',
more:'<circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/>',
image:'<rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>',
camera:'<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/>',
file:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/>',
x:'<path d="M18 6 6 18M6 6l12 12"/>',folder:'<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9l-.8-1.2A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z"/>',
move:'<path d="m5 9-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M2 12h20M12 2v20"/>',dl:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>'};
const ic=(k,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>`;

/* ---------- Storage ---------- */
const DB={db:null,mem:null,
  async init(){
    try{
      this.db=await new Promise((res,rej)=>{
        const r=indexedDB.open('devvault',2);
        r.onupgradeneeded=()=>{const d=r.result;STORES.forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'})})};
        r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
      });
    }catch(e){
      this.db=null;try{this.mem=JSON.parse(localStorage.getItem('devvault')||'{}')}catch(_){this.mem={}}
      STORES.forEach(n=>this.mem[n]=this.mem[n]||{});toast('IndexedDB unavailable — limited storage');
    }
  },
  _save(){try{localStorage.setItem('devvault',JSON.stringify(this.mem))}catch(e){toast('Storage full')}},
  all(s){if(!this.db)return Promise.resolve(Object.values(this.mem[s]));
    return new Promise((res,rej)=>{const r=this.db.transaction(s).objectStore(s).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  get(s,id){if(!this.db)return Promise.resolve(this.mem[s][id]);
    return new Promise((res,rej)=>{const r=this.db.transaction(s).objectStore(s).get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  put(s,v){if(!this.db){this.mem[s][v.id]=v;this._save();return Promise.resolve()}
    return new Promise((res,rej)=>{const t=this.db.transaction(s,'readwrite');t.objectStore(s).put(v);t.oncomplete=res;t.onerror=()=>rej(t.error)})},
  del(s,id){if(!this.db){delete this.mem[s][id];this._save();return Promise.resolve()}
    return new Promise((res,rej)=>{const t=this.db.transaction(s,'readwrite');t.objectStore(s).delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error)})},
  async clear(){if(!this.db){STORES.forEach(n=>this.mem[n]={});this._save();return}
    for(const s of STORES)await new Promise(r=>{const t=this.db.transaction(s,'readwrite');t.objectStore(s).clear();t.oncomplete=r})}
};

/* ---------- State ---------- */
let S={nodes:[],items:[],sel:null,query:'',open:{},pending:[],drafts:{}};
const node=id=>S.nodes.find(n=>n.id===id);
const kids=pid=>S.nodes.filter(n=>n.parentId===pid);
function descendants(id){const o=[];(function w(p){kids(p).forEach(k=>{o.push(k.id);w(k.id)})})(id);return o}
function pathOf(id){const p=[];let n=node(id);while(n){p.unshift(n.name);n=n.parentId?node(n.parentId):null}return p}
async function load(){
  S.nodes=(await DB.all('nodes')).map(n=>({...n,order:n.order??n.created})).sort((a,b)=>a.order-b.order);
  S.items=(await DB.all('items')).sort((a,b)=>a.created-b.created);
}
async function migrate(){
  const ps=await DB.all('projects'),cs=await DB.all('channels');if(!ps.length&&!cs.length)return;
  for(const p of ps){await DB.put('nodes',{id:p.id,parentId:null,name:p.name,created:p.created,order:p.created});await DB.del('projects',p.id)}
  for(const c of cs){await DB.put('nodes',{id:c.id,parentId:c.projectId,name:c.name,created:c.created,order:c.created});await DB.del('channels',c.id)}
  for(const it of await DB.all('items'))if(it.channelId){it.nodeId=it.channelId;delete it.channelId;delete it.projectId;await DB.put('items',it)}
}
function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hidden'),2400)}
function toggleSide(o){$('side').classList.toggle('open',o);$('scrim').classList.toggle('hidden',!o)}

/* ---------- Bottom sheet ---------- */
function sheet(title,items){
  $('sheetT').textContent=title;sheet.items=items;
  $('sheetL').innerHTML=items.map((x,i)=>`<button class="sitem ${x.danger?'dng':''}" onclick="sheetPick(${i})">${ic(x.icon,20)}<span>${esc(x.label)}</span></button>`).join('');
  $('sheet').classList.remove('hidden');
}
function sheetPick(i){const it=sheet.items[i];closeSheet();it.fn()}
function closeSheet(){$('sheet').classList.add('hidden')}
function plusMenu(){sheet('Add to message',[
  {icon:'image',label:'Photo / Video',fn:()=>$('fPhoto').click()},
  {icon:'camera',label:'Camera',fn:()=>$('fCam').click()},
  {icon:'file',label:'File / Document',fn:()=>$('fDoc').click()}])}

/* ---------- Branches ---------- */
async function addNode(parentId){
  const name=prompt('Name of the new branch'+(parentId?` inside "${node(parentId).name}"`:' (top level)'));if(!name||!name.trim())return;
  const n={id:uid(),parentId:parentId||null,name:name.trim(),created:Date.now(),order:Date.now()};
  await DB.put('nodes',n);await load();if(parentId)S.open[parentId]=true;select(n.id);
}
async function renameNode(id){const n=node(id),v=prompt('Rename',n.name);if(!v||!v.trim())return;n.name=v.trim();await DB.put('nodes',n);await load();render()}
async function moveNode(id,dir){
  const n=node(id),sibs=kids(n.parentId),i=sibs.findIndex(x=>x.id===id),j=i+dir;
  if(j<0||j>=sibs.length)return toast(dir<0?'Already first':'Already last');
  sibs.forEach((s,k)=>s.order=k);[sibs[i].order,sibs[j].order]=[sibs[j].order,sibs[i].order];
  for(const s of sibs)await DB.put('nodes',s);await load();render();
}
function nodeMenu(id){sheet(node(id).name,[
  {icon:'plus',label:'Add sub-branch',fn:()=>addNode(id)},
  {icon:'edit',label:'Rename',fn:()=>renameNode(id)},
  {icon:'up',label:'Move up',fn:()=>moveNode(id,-1)},
  {icon:'down',label:'Move down',fn:()=>moveNode(id,1)},
  {icon:'move',label:'Move to… (with everything inside)',fn:()=>moveToMenu(id)},
  {icon:'trash',label:'Delete',danger:1,fn:()=>delNode(id)}])}
function moveToMenu(id){
  const n=node(id),banned=new Set([id,...descendants(id)]),items=[];
  if(n.parentId)items.push({icon:'folder',label:'Top level (make it a block)',fn:()=>moveTo(id,null)});
  (function walk(pid,depth){
    kids(pid).forEach(k=>{
      if(banned.has(k.id))return;
      if(k.id!==n.parentId)items.push({icon:'folder',label:'\u00a0\u00a0\u00a0'.repeat(depth)+k.name,fn:()=>moveTo(id,k.id)});
      walk(k.id,depth+1);
    });
  })(null,0);
  if(!items.length)return toast('No other place to move it to');
  sheet(`Move "${n.name}" to…`,items);
}
async function moveTo(id,newParent){
  const n=node(id);
  if(newParent&&(newParent===id||descendants(id).includes(newParent)))return toast("Can't move a branch into itself");
  n.parentId=newParent;n.order=Date.now();await DB.put('nodes',n);
  if(newParent)S.open[newParent]=true;S.open[id]=true;
  await load();render();
  toast(`Moved "${n.name}" to ${newParent?'"'+node(newParent).name+'"':'top level'}`);
}
async function delNode(id){
  const ids=[id,...descendants(id)],its=S.items.filter(i=>ids.includes(i.nodeId));
  if(!confirm(`Delete "${node(id).name}"${ids.length>1?` and ${ids.length-1} sub-branch(es)`:''} with ${its.length} message(s)? This can't be undone.`))return;
  for(const it of its){await purgeItem(it)}
  for(const i of ids){await DB.del('nodes',i);delete S.drafts[i]}
  if(ids.includes(S.sel)){S.sel=null;S.pending=[];$('input').value=''}
  await load();render();
}
function select(id){
  if(S.sel)S.drafts[S.sel]={t:$('input').value,p:S.pending};
  S.sel=id;S.query='';$('gsearch').value='';
  const d=S.drafts[id]||{t:'',p:[]};$('input').value=d.t;S.pending=d.p;
  if(kids(id).length)S.open[id]=true;
  renderChips();autosize();render(true);toggleSide(false);
}

/* ---------- Messages ---------- */
function norm(it){
  if(it.type==='file')return{text:'',files:[{name:it.name,size:it.size,mime:it.mime,blobId:it.blobId}]};
  if(it.type==='check')return{text:'',files:[],tasks:it.tasks};
  return{text:it.text||'',files:it.files||[]};
}
async function purgeItem(it){for(const f of norm(it).files)if(f.blobId)await DB.del('blobs',f.blobId);await DB.del('items',it.id)}
function addPending(files){for(const f of files)S.pending.push({file:f,url:f.type.startsWith('image/')?URL.createObjectURL(f):null});renderChips();autosize()}
function renderChips(){
  $('chips').innerHTML=S.pending.map((p,i)=>`<div class="chip">${p.url?`<img src="${p.url}" alt="">`:ic('file')}<span class="truncate" style="max-width:110px">${esc(p.file.name||'photo')}</span><button onclick="S.pending.splice(${i},1);renderChips();autosize()" aria-label="Remove">${ic('x',14)}</button></div>`).join('');
  $('chips').style.display=S.pending.length?'flex':'none';
}
function autosize(){
  const t=$('input');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,innerHeight*.45)+'px';
  $('bSend').disabled=!(t.value.trim()||S.pending.length);
}
async function sendMsg(){
  const text=$('input').value.trim();if(!S.sel||(!text&&!S.pending.length))return;
  try{
    const files=[];
    for(const p of S.pending){const bid=uid();await DB.put('blobs',{id:bid,blob:p.file});files.push({name:p.file.name||'photo.jpg',size:p.file.size,mime:p.file.type||'application/octet-stream',blobId:bid})}
    await DB.put('items',{id:uid(),type:'msg',nodeId:S.sel,created:Date.now(),text,files});
  }catch(e){return toast('Could not save (storage full?)')}
  $('input').value='';S.pending=[];delete S.drafts[S.sel];renderChips();autosize();await load();render(true);
}
/* big writing window */
function openEditor(title,text,cb,label){
  $('edTitle').textContent=title;$('edTa').value=text;$('edDone').textContent=label||'Done';S.edCb=cb;
  $('editor').classList.remove('hidden');setTimeout(()=>{const t=$('edTa');t.focus();t.setSelectionRange(t.value.length,t.value.length)},50);
}
function closeEditor(){$('editor').classList.add('hidden')}
function editorDone(){const v=$('edTa').value;closeEditor();S.edCb&&S.edCb(v)}
function expandComposer(){openEditor('Write message',$('input').value,v=>{$('input').value=v;autosize();$('input').focus()},'Done')}
function editMsg(id){
  const it=S.items.find(x=>x.id===id),m=norm(it);
  openEditor('Edit message',m.text,async v=>{
    if(!v.trim()&&!m.files.length)return toast('Message would be empty');
    it.text=v.trim();it.edited=Date.now();if(it.type==='text')it.type='msg';await DB.put('items',it);await load();render();toast('Saved');
  },'Save');
}
async function delMsg(id){const it=S.items.find(x=>x.id===id);if(!it||!confirm('Delete this message?'))return;await purgeItem(it);await load();render()}
async function copyMsg(id){
  const t=norm(S.items.find(x=>x.id===id)).text;if(!t)return toast('No text to copy');
  try{await navigator.clipboard.writeText(t)}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}
  toast('Copied');
}
async function toggleTask(id,i){const it=S.items.find(x=>x.id===id);it.tasks[i].done=!it.tasks[i].done;await DB.put('items',it);render()}

/* ---------- Files, sharing (native Capacitor or browser) ---------- */
const cap=()=>{const C=window.Capacitor;return C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.Share&&C.Plugins.Filesystem?C.Plugins:null};
const blobToB64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
async function shareFiles({text,files,title}){
  const P=cap();
  if(P){
    const uris=[];
    for(const f of files){const w=await P.Filesystem.writeFile({path:f.name.replace(/[\\/:*?"<>|]/g,'_'),data:(await blobToB64(f.blob)).split(',')[1],directory:'CACHE'});uris.push(w.uri)}
    await P.Share.share({title,text:text||undefined,files:uris.length?uris:undefined,dialogTitle:title});return true;
  }
  if(navigator.share){
    try{
      const fs=files.map(f=>new File([f.blob],f.name,{type:f.blob.type}));const d={title,text:text||undefined};
      if(fs.length&&navigator.canShare&&navigator.canShare({files:fs}))d.files=fs;
      await navigator.share(d);return true;
    }catch(e){if(e.name==='AbortError')return true}
  }
  return false;
}
function browserSave(name,blob){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}
async function getBlob(f){const b=await DB.get('blobs',f.blobId);return b?b.blob:null}
async function shareMsg(id){
  const it=S.items.find(x=>x.id===id),m=norm(it),files=[];
  for(const f of m.files){const b=await getBlob(f);if(b)files.push({name:f.name,blob:b})}
  const ok=await shareFiles({text:m.text,files,title:'DevVault'});
  if(!ok){if(m.text){await copyMsg(id);toast('Sharing not supported here — text copied')}else toast('Sharing not supported here')}
}
async function openFile(id,i){
  const f=norm(S.items.find(x=>x.id===id)).files[i],b=await getBlob(f);if(!b)return toast('File missing');
  if(cap())return shareFiles({files:[{name:f.name,blob:b}],title:f.name});
  window.open(URL.createObjectURL(b),'_blank');
}
async function dlFile(id,i){
  const f=norm(S.items.find(x=>x.id===id)).files[i],b=await getBlob(f);if(!b)return toast('File missing');
  if(cap())return shareFiles({files:[{name:f.name,blob:b}],title:f.name});
  browserSave(f.name,b);
}
async function viewImg(bid){
  const b=await DB.get('blobs',bid);if(!b)return;
  const it=S.items.find(i=>norm(i).files.some(f=>f.blobId===bid)),f=norm(it).files.find(f=>f.blobId===bid);
  $('vImg').src=URL.createObjectURL(b.blob);
  $('vSave').innerHTML=ic('dl');$('vSave').onclick=e=>{e.stopPropagation();cap()?shareFiles({files:[{name:f.name,blob:b.blob}],title:f.name}):browserSave(f.name,b.blob)};
  $('vX').innerHTML=ic('x');$('viewer').classList.remove('hidden');
}
function closeViewer(){$('viewer').classList.add('hidden')}

/* ---------- Rendering ---------- */
const fmtSize=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB';
function hl(h,q){if(!q)return h;return h.replace(new RegExp('('+esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>')}
function md(s,q){
  return s.split(/```/).map((p,i)=>{
    if(i%2)return `<pre class="code">${hl(esc(p.replace(/^\w*\n/,'')),q)}</pre>`;
    const h=hl(esc(p),q).replace(/`([^`\n]+)`/g,'<code class="ic">$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/^#{1,3} (.+)$/gm,'<b style="font-size:16px">$1</b>');
    return `<div style="white-space:pre-wrap;word-break:break-word;line-height:1.55">${h}</div>`;
  }).join('');
}
function dayLabel(ts){
  const d=new Date(ts),t=new Date(),y=new Date(Date.now()-864e5);
  if(d.toDateString()===t.toDateString())return'Today';if(d.toDateString()===y.toDateString())return'Yesterday';
  return d.toLocaleDateString([], {day:'numeric',month:'short',year:'numeric'});
}
function msgHTML(it,q,showLoc){
  const m=norm(it),time=new Date(it.created).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
  const loc=showLoc&&node(it.nodeId)?`<a href="#" class="truncate" style="color:var(--acc);display:block;margin-bottom:4px;font-size:12px" onclick="select('${it.nodeId}');return false">${esc(pathOf(it.nodeId).join(' / '))}</a>`:'';
  let b='';
  m.files.forEach((f,i)=>{
    b+=f.mime.startsWith('image/')?`<img data-blob="${f.blobId}" class="att-img" onclick="viewImg('${f.blobId}')" alt="${esc(f.name)}">`:
    `<div class="att-file" onclick="openFile('${it.id}',${i})">${ic('file',22)}<div class="min-w-0 flex-1"><div class="truncate">${hl(esc(f.name),q)}</div><div class="text-xs" style="color:var(--mute)">${fmtSize(f.size)}</div></div><span onclick="event.stopPropagation();dlFile('${it.id}',${i})" style="padding:6px">${ic('dl')}</span></div>`;
  });
  if(m.text)b+=md(m.text,q);
  if(m.tasks){b+=m.tasks.map((t,i)=>`<label class="flex gap-2 items-start py-1 cursor-pointer"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${it.id}',${i})" class="mt-1" style="accent-color:var(--acc);width:16px;height:16px"><span style="${t.done?'text-decoration:line-through;color:var(--mute)':''}">${hl(esc(t.t),q)}</span></label>`).join('')}
  const acts=`<button class="ib sm" onclick="shareMsg('${it.id}')" title="Share">${ic('share',16)}</button>`+
    (m.tasks?'':`<button class="ib sm" onclick="copyMsg('${it.id}')" title="Copy">${ic('copy',16)}</button><button class="ib sm" onclick="editMsg('${it.id}')" title="Edit">${ic('edit',16)}</button>`)+
    `<button class="ib sm" onclick="delMsg('${it.id}')" title="Delete">${ic('trash',16)}</button>`;
  return `<div class="msg">${loc}<div class="bubble">${b}<div class="mt">${time}${it.edited?' · edited':''}</div></div><div class="acts">${acts}</div></div>`;
}
const GLYPH=['■','●','○'];
function rowsHTML(pid,depth){
  return kids(pid).map(n=>{
    const k=kids(n.id),open=S.open[n.id],on=n.id===S.sel&&!S.query.trim();
    return `<div class="nav ${on?'on':''}" style="padding-left:${6+depth*16}px;${depth===0?'color:var(--text);font-weight:600':''}" onclick="select('${n.id}')">`+
      `<span style="width:20px;text-align:center;font-size:11px;padding:8px 0" onclick="event.stopPropagation();S.open['${n.id}']=!S.open['${n.id}'];renderTree()">${k.length?(open?'▾':'▸'):''}</span>`+
      `<span style="font-size:9px;color:var(--acc)">${GLYPH[Math.min(depth,2)]}</span><span class="truncate">${esc(n.name)}</span>`+
      `<span class="dots" onclick="event.stopPropagation();nodeMenu('${n.id}')">${ic('more')}</span></div>`+(open&&k.length?rowsHTML(n.id,depth+1):'');
  }).join('');
}
function renderTree(){$('tree').innerHTML=S.nodes.length?rowsHTML(null,0):'<div class="p-3 text-sm" style="color:var(--mute)">Nothing here yet. Tap “+ Block” to start.</div>'}
function feedHTML(list,q,showLoc){
  let last='',h='';
  for(const it of list){const d=new Date(it.created).toDateString();if(d!==last){last=d;h+=`<div class="day">${dayLabel(it.created)}</div>`}h+=msgHTML(it,q,showLoc)}
  return h;
}
function render(scroll){
  renderTree();
  const feed=$('feed'),q=S.query.trim();$('hdr').innerHTML='';
  $('composer').style.display=(S.sel&&node(S.sel)&&!q)?'':'none';
  $('bSend').innerHTML=ic('up',20);$('bExpand').innerHTML=ic('expand',18);document.querySelector('.cbox .rb').innerHTML=ic('plus',22);
  if(q){
    $('title').textContent=`Search: "${q}"`;const lq=q.toLowerCase();
    const hits=S.items.filter(it=>{const m=norm(it);return m.text.toLowerCase().includes(lq)||m.files.some(f=>f.name.toLowerCase().includes(lq))||(m.tasks||[]).some(t=>t.t.toLowerCase().includes(lq))});
    feed.innerHTML=hits.length?feedHTML(hits,q,true):'<div style="color:var(--mute)">No matches in any branch.</div>';
  }else if(!S.sel||!node(S.sel)){
    S.sel=null;$('title').textContent='DevVault';
    feed.innerHTML=S.nodes.length?'<div style="color:var(--mute)">Pick a branch from the sidebar.</div>':
    `<div class="panel rounded-lg p-4 max-w-md"><b>Welcome to DevVault</b><p class="mt-2" style="color:var(--mute)">Build your own tree of blocks and branches. Every branch is a chat where you can write, attach photos and files, and keep everything on this device.</p><button class="btn btn-acc mt-3" onclick="addNode(null)">Add first block</button></div>`;
  }else{
    const n=node(S.sel);
    $('title').innerHTML=pathOf(n.id).map(esc).join(' <span style="color:var(--mute)">/</span> ');
    $('hdr').innerHTML=`<button class="ib" onclick="nodeMenu('${n.id}')" aria-label="Branch menu">${ic('more')}</button>`;
    const sub=kids(n.id),its=S.items.filter(i=>i.nodeId===S.sel);
    feed.innerHTML=(sub.length?`<div class="flex gap-2" style="flex-wrap:wrap;margin-bottom:12px">${sub.map(s=>`<button class="btn" onclick="select('${s.id}')">${s.name?esc(s.name):''}</button>`).join('')}</div>`:'')+
      (its.length?feedHTML(its):'<div style="color:var(--mute);text-align:center;margin-top:30px">No messages yet. Write below or tap + to attach.</div>');
  }
  feed.querySelectorAll('img[data-blob]').forEach(async im=>{const b=await DB.get('blobs',im.dataset.blob);if(b)im.src=URL.createObjectURL(b.blob)});
  if(scroll)feed.scrollTop=feed.scrollHeight;
}
function onSearch(v){S.query=v;render()}

/* ---------- Backup / Restore (exact copy, same order) ---------- */
async function exportAll(){
  try{
    toast('Preparing backup…');
    const blobs=await DB.all('blobs'),parts=[];
    parts.push('{"app":"DevVault","version":3,"exported":'+JSON.stringify(new Date().toISOString())+',"counts":'+JSON.stringify({nodes:S.nodes.length,items:S.items.length,files:blobs.length})+',"ui":'+JSON.stringify({open:S.open,sel:S.sel})+',"nodes":'+JSON.stringify(S.nodes)+',"items":'+JSON.stringify(S.items)+',"blobs":[');
    for(let i=0;i<blobs.length;i++)parts.push((i?',':'')+JSON.stringify({id:blobs[i].id,type:blobs[i].blob.type,data:await blobToB64(blobs[i].blob)}));
    parts.push(']}');
    const blob=new Blob(parts,{type:'application/json'}),name='DevVault-backup-'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')+'.json';
    if(cap()){await shareFiles({files:[{name,blob}],title:'DevVault backup'})}else{browserSave(name,blob)}
    toast(`Backup ready: ${S.nodes.length} branches, ${S.items.length} messages, ${blobs.length} files`);
  }catch(e){toast('Backup failed: '+e.message)}
}
async function importAll(file){
  if(!file)return;
  try{
    const d=JSON.parse(await file.text());
    if(d.app!=='DevVault')throw new Error('not a DevVault backup');
    let nodes=d.nodes,items=d.items;
    if(!nodes){
      nodes=[...d.projects.map(p=>({id:p.id,parentId:null,name:p.name,created:p.created})),...d.channels.map(c=>({id:c.id,parentId:c.projectId,name:c.name,created:c.created}))];
      items=d.items.map(i=>{const o={...i,nodeId:i.channelId};delete o.channelId;delete o.projectId;return o});
    }
    nodes=nodes.map(n=>({...n,order:n.order??n.created}));
    if(!confirm(`Restore backup?\n${nodes.length} branches, ${items.length} messages, ${d.blobs.length} files.\nThis REPLACES everything currently in the app.`))return;
    toast('Restoring…');await DB.clear();
    for(const n of nodes)await DB.put('nodes',n);
    for(const i of items)await DB.put('items',i);
    for(const b of d.blobs){const blob=await (await fetch(b.data)).blob();await DB.put('blobs',{id:b.id,blob})}
    S.drafts={};S.pending=[];$('input').value='';await load();
    if(S.nodes.length!==nodes.length||S.items.length!==items.length)throw new Error('verification failed');
    S.open=(d.ui&&d.ui.open)||{};S.sel=(d.ui&&node(d.ui.sel))?d.ui.sel:null;render(true);toast('Restored: identical copy of the backup');
  }catch(e){toast('Restore failed: '+e.message)}
}

/* ---------- Init ---------- */
['dragenter','dragover'].forEach(e=>$('feed').addEventListener(e,ev=>{ev.preventDefault();$('feed').classList.add('drop')}));
['dragleave','drop'].forEach(e=>$('feed').addEventListener(e,ev=>{ev.preventDefault();$('feed').classList.remove('drop')}));
$('feed').addEventListener('drop',ev=>{if(S.sel&&ev.dataTransfer&&ev.dataTransfer.files.length)addPending(ev.dataTransfer.files)});
$('input').addEventListener('paste',e=>{const fs=[...(e.clipboardData?e.clipboardData.files:[])];if(fs.length){e.preventDefault();addPending(fs)}});
$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();sendMsg()}});
(async()=>{
  await DB.init();await migrate();await load();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  render();autosize();
})();
</script>
