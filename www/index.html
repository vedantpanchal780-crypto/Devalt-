<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DevVault</title>
<style>
/* Minimal local utilities (replaces Tailwind CDN; no external dependencies) */
*,*::before,*::after{box-sizing:border-box}
.flex{display:flex}.flex-col{flex-direction:column}.flex-1{flex:1 1 0%}.shrink-0{flex-shrink:0}
.items-center{align-items:center}.items-start{align-items:flex-start}.items-end{align-items:flex-end}
.justify-between{justify-content:space-between}
.gap-1{gap:4px}.gap-2{gap:8px}.gap-3{gap:12px}
.h-full{height:100%}.w-72{width:18rem}.min-w-0{min-width:0}.max-w-md{max-width:28rem}.max-h-64{max-height:16rem}
.p-3{padding:12px}.p-4{padding:16px}.px-2{padding-left:8px;padding-right:8px}.px-3{padding-left:12px;padding-right:12px}
.py-1{padding-top:4px;padding-bottom:4px}.py-2{padding-top:8px;padding-bottom:8px}.pb-2{padding-bottom:8px}
.mb-1{margin-bottom:4px}.mb-2{margin-bottom:8px}.mt-1{margin-top:4px}.mt-2{margin-top:8px}.mt-3{margin-top:12px}.ml-auto{margin-left:auto}
.space-y-3>*+*{margin-top:12px}
.overflow-y-auto{overflow-y:auto}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.text-xs{font-size:12px}.text-sm{font-size:13px}.font-medium{font-weight:500}.font-semibold{font-weight:600}
.rounded-md{border-radius:6px}.rounded-lg{border-radius:10px}
.cursor-pointer{cursor:pointer}
.fixed{position:fixed}.inset-0{inset:0}.z-20{z-index:20}.z-50{z-index:50}
.bg-black\/60{background:rgba(0,0,0,.6)}
.left-1\/2{left:50%}.bottom-6{bottom:24px}.-translate-x-1\/2{transform:translateX(-50%)}
.hidden{display:none}
@media(min-width:768px){.md\:hidden{display:none!important}}
</style>
<style>
:root{--bg:#14161a;--panel:#1b1e24;--side:#101216;--line:#2a2e37;--text:#e6e8ec;--mute:#8b92a0;--acc:#f0a53a}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,Roboto,sans-serif;font-size:14px}
*{scrollbar-width:thin;scrollbar-color:#333 transparent}
.panel{background:var(--panel);border:1px solid var(--line)}
.btn{padding:6px 10px;border-radius:6px;background:#262a33;border:1px solid var(--line);color:var(--text);cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--acc)}
.btn-acc{background:var(--acc);color:#1a1200;border-color:var(--acc);font-weight:600}
.inp{background:#0f1115;border:1px solid var(--line);border-radius:6px;color:var(--text);padding:8px 10px;width:100%;outline:none}
.inp:focus{border-color:var(--acc)}
.nav{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:6px;cursor:pointer;color:var(--mute);min-height:34px}
.nav:hover{background:#1a1d23;color:var(--text)}
.nav.on{background:#262a33;color:var(--text)}
.nav .x{margin-left:auto;opacity:0;font-size:12px}
.nav:hover .x,.nav.on .x{opacity:.7}
@media(hover:none){.nav .x{opacity:.7}}
pre.code{background:#0b0d10;border:1px solid var(--line);border-radius:6px;padding:10px;overflow-x:auto;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
code.ic{background:#0b0d10;padding:1px 5px;border-radius:4px;font:12.5px ui-monospace,Menlo,monospace;color:var(--acc)}
#side{transition:transform .2s}
@media(max-width:767px){#side{position:fixed;inset:0 auto 0 0;width:84%;max-width:320px;z-index:30;transform:translateX(-100%)}#side.open{transform:none}}
.drop{border:2px dashed var(--acc)!important;background:#2a2112}
mark{background:#6b4a10;color:#fff;border-radius:2px}
</style>
</head>
<body>
<div class="flex h-full" style="padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)">
  <div id="scrim" class="fixed inset-0 bg-black/60 z-20 hidden md:hidden" onclick="toggleSide(false)"></div>
  <aside id="side" class="flex flex-col w-72 shrink-0" style="background:var(--side);border-right:1px solid var(--line)">
    <div class="p-3 flex items-center justify-between">
      <b style="font-size:16px;letter-spacing:.3px">DevVault</b>
      <button class="btn" onclick="addNode(null)">+ Block</button>
    </div>
    <div class="px-3 pb-2"><input id="gsearch" class="inp" placeholder="Search everything…" oninput="onSearch(this.value)"></div>
    <nav id="tree" class="flex-1 overflow-y-auto px-2 pb-2"></nav>
    <div class="p-3 flex gap-2" style="border-top:1px solid var(--line)">
      <button class="btn flex-1" onclick="exportAll()">Export backup</button>
      <button class="btn flex-1" onclick="$('imp').click()">Import</button>
      <input id="imp" type="file" accept=".json" class="hidden" onchange="importAll(this.files[0]);this.value=''">
    </div>
  </aside>
  <main class="flex-1 flex flex-col min-w-0 h-full" id="main">
    <header class="flex items-center gap-2 px-3 py-2" style="border-bottom:1px solid var(--line)">
      <button class="btn md:hidden" onclick="toggleSide(true)" aria-label="Menu">☰</button>
      <div id="title" class="font-semibold truncate"></div><div id="hdr" class="ml-auto flex gap-1"></div>
    </header>
    <section id="feed" class="flex-1 overflow-y-auto p-3 space-y-3"></section>
    <footer id="composer" class="p-3" style="border-top:1px solid var(--line)">
      <div class="flex gap-2 mb-2 text-xs">
        <button class="btn" id="m-text" onclick="setMode('text')">Text</button>
        <button class="btn" id="m-check" onclick="setMode('check')">Checklist</button>
        <button class="btn" onclick="$('file').click()">Upload file</button>
        <input id="file" type="file" multiple class="hidden" onchange="uploadFiles(this.files);this.value=''">
      </div>
      <div class="flex gap-2 items-end">
        <textarea id="input" rows="2" class="inp" style="resize:none;max-height:160px"></textarea>
        <button class="btn btn-acc" onclick="submitItem()">Add</button>
      </div>
      <div class="text-xs mt-1" style="color:var(--mute)" id="hint"></div>
    </footer>
  </main>
</div>
<div id="toast" class="fixed left-1/2 bottom-6 -translate-x-1/2 px-3 py-2 rounded-md hidden z-50" style="background:#000;border:1px solid var(--line)"></div>

<script>
const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STORES=['projects','channels','nodes','items','blobs'];

/* ---------- Storage: IndexedDB with localStorage fallback ---------- */
const DB={db:null,mem:null,
  async init(){
    try{
      this.db=await new Promise((res,rej)=>{
        const r=indexedDB.open('devvault',2);
        r.onupgradeneeded=()=>{const d=r.result;STORES.forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'})})};
        r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
      });
    }catch(e){
      this.db=null;
      try{this.mem=JSON.parse(localStorage.getItem('devvault')||'{}')}catch(_){this.mem={}}
      STORES.forEach(n=>this.mem[n]=this.mem[n]||{});
      toast('IndexedDB unavailable — using limited localStorage');
    }
  },
  _save(){try{localStorage.setItem('devvault',JSON.stringify(this.mem))}catch(e){toast('Storage full')}},
  all(s){
    if(!this.db)return Promise.resolve(Object.values(this.mem[s]));
    return new Promise((res,rej)=>{const r=this.db.transaction(s).objectStore(s).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  },
  get(s,id){
    if(!this.db)return Promise.resolve(this.mem[s][id]);
    return new Promise((res,rej)=>{const r=this.db.transaction(s).objectStore(s).get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  },
  put(s,v){
    if(!this.db){this.mem[s][v.id]=v;this._save();return Promise.resolve()}
    return new Promise((res,rej)=>{const t=this.db.transaction(s,'readwrite');t.objectStore(s).put(v);t.oncomplete=res;t.onerror=()=>rej(t.error)});
  },
  del(s,id){
    if(!this.db){delete this.mem[s][id];this._save();return Promise.resolve()}
    return new Promise((res,rej)=>{const t=this.db.transaction(s,'readwrite');t.objectStore(s).delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error)});
  },
  async clear(){
    if(!this.db){STORES.forEach(n=>this.mem[n]={});this._save();return}
    for(const s of STORES)await new Promise(r=>{const t=this.db.transaction(s,'readwrite');t.objectStore(s).clear();t.oncomplete=r});
  }
};

/* ---------- State ---------- */
let S={nodes:[],items:[],sel:null,mode:'text',query:'',open:{}};
const node=id=>S.nodes.find(n=>n.id===id);
const kids=pid=>S.nodes.filter(n=>n.parentId===pid);
function descendants(id){const out=[];(function walk(p){kids(p).forEach(k=>{out.push(k.id);walk(k.id)})})(id);return out}
function pathOf(id){const p=[];let n=node(id);while(n){p.unshift(n.name);n=n.parentId?node(n.parentId):null}return p}

async function load(){
  S.nodes=(await DB.all('nodes')).sort((a,b)=>a.created-b.created);
  S.items=(await DB.all('items')).sort((a,b)=>a.created-b.created);
}
/* Convert data from the earlier Project/Channel version into branches */
async function migrate(){
  const ps=await DB.all('projects'),cs=await DB.all('channels');
  if(!ps.length&&!cs.length)return;
  for(const p of ps){await DB.put('nodes',{id:p.id,parentId:null,name:p.name,created:p.created});await DB.del('projects',p.id)}
  for(const c of cs){await DB.put('nodes',{id:c.id,parentId:c.projectId,name:c.name,created:c.created});await DB.del('channels',c.id)}
  for(const it of await DB.all('items')){
    if(it.channelId){it.nodeId=it.channelId;delete it.channelId;delete it.projectId;await DB.put('items',it)}
  }
}
function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hidden'),2200)}
function toggleSide(o){$('side').classList.toggle('open',o);$('scrim').classList.toggle('hidden',!o)}

/* ---------- Branch management (any depth) ---------- */
async function addNode(parentId){
  const where=parentId?` inside "${node(parentId).name}"`:' (top level)';
  const name=prompt('Name of the new branch'+where);if(!name||!name.trim())return;
  const n={id:uid(),parentId:parentId||null,name:name.trim(),created:Date.now()};
  await DB.put('nodes',n);await load();
  if(parentId)S.open[parentId]=true;S.sel=n.id;S.query='';$('gsearch').value='';render();
}
async function renameNode(id){
  const n=node(id);const v=prompt('Rename',n.name);if(!v||!v.trim())return;
  n.name=v.trim();await DB.put('nodes',n);await load();render();
}
async function delNode(id){
  const ids=[id,...descendants(id)];
  const its=S.items.filter(i=>ids.includes(i.nodeId));
  const extra=ids.length>1?` and ${ids.length-1} sub-branch(es)`:'';
  if(!confirm(`Delete "${node(id).name}"${extra}, including ${its.length} item(s)? This can't be undone.`))return;
  for(const it of its){if(it.blobId)await DB.del('blobs',it.blobId);await DB.del('items',it.id)}
  for(const i of ids)await DB.del('nodes',i);
  if(ids.includes(S.sel))S.sel=null;await load();render();
}
function select(id){
  S.sel=id;S.query='';$('gsearch').value='';
  if(kids(id).length)S.open[id]=true;render();toggleSide(false);
}

/* ---------- Items ---------- */
function setMode(m){S.mode=m;renderComposer()}
function renderComposer(){
  $('m-text').style.borderColor=S.mode==='text'?'var(--acc)':'';
  $('m-check').style.borderColor=S.mode==='check'?'var(--acc)':'';
  $('input').placeholder=S.mode==='check'?'One task per line…':'Paste a prompt, note or snippet… (use ``` for code blocks)';
  $('hint').textContent=S.mode==='check'?'Each line becomes a checkbox.':'Ctrl/Cmd+Enter to add. Drop files anywhere in the feed.';
  $('composer').style.display=(S.sel&&!S.query.trim())?'':'none';
}
async function submitItem(){
  const v=$('input').value;if(!v.trim()||!S.sel)return;
  const it={id:uid(),nodeId:S.sel,created:Date.now()};
  if(S.mode==='check'){it.type='check';it.tasks=v.split('\n').map(t=>t.trim()).filter(Boolean).map(t=>({t,done:false}))}
  else{it.type='text';it.text=v}
  await DB.put('items',it);$('input').value='';await load();render(true);
}
async function uploadFiles(files){
  if(!S.sel)return toast('Select a branch first');
  for(const f of files){
    const bid=uid();
    try{
      await DB.put('blobs',{id:bid,blob:f});
      await DB.put('items',{id:uid(),type:'file',nodeId:S.sel,created:Date.now(),name:f.name,size:f.size,mime:f.type||'application/octet-stream',blobId:bid});
    }catch(e){toast('Could not store '+f.name)}
  }
  await load();render(true);
}
async function delItem(id){
  const it=S.items.find(i=>i.id===id);if(!it||!confirm('Delete this item?'))return;
  if(it.blobId)await DB.del('blobs',it.blobId);await DB.del('items',id);await load();render();
}
async function toggleTask(id,i){const it=S.items.find(x=>x.id===id);it.tasks[i].done=!it.tasks[i].done;await DB.put('items',it);render()}
async function editItem(id){const it=S.items.find(x=>x.id===id);const v=prompt('Edit',it.text);if(v==null)return;it.text=v;await DB.put('items',it);render()}
async function copyText(id){
  const it=S.items.find(x=>x.id===id);
  try{await navigator.clipboard.writeText(it.text)}catch(e){
    const ta=document.createElement('textarea');ta.value=it.text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();
  }toast('Copied');
}
async function fileBlobUrl(it){const b=await DB.get('blobs',it.blobId);return b?URL.createObjectURL(b.blob):null}
async function openFile(id){const it=S.items.find(x=>x.id===id);const u=await fileBlobUrl(it);if(!u)return toast('File missing');window.open(u,'_blank')}
async function dlFile(id){
  const it=S.items.find(x=>x.id===id);const u=await fileBlobUrl(it);if(!u)return toast('File missing');
  const a=document.createElement('a');a.href=u;a.download=it.name;document.body.appendChild(a);a.click();a.remove();
}

/* ---------- Rendering ---------- */
function fmtSize(n){return n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB'}
function hl(h,q){if(!q)return h;const r=new RegExp('('+esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');return h.replace(r,'<mark>$1</mark>')}
function md(s,q){
  return s.split(/```/).map((p,i)=>{
    if(i%2)return `<pre class="code">${hl(esc(p.replace(/^\w*\n/,'')),q)}</pre>`;
    const h=hl(esc(p),q).replace(/`([^`\n]+)`/g,'<code class="ic">$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/^#{1,3} (.+)$/gm,'<b style="font-size:15px">$1</b>');
    return `<div style="white-space:pre-wrap;word-break:break-word;line-height:1.55">${h}</div>`;
  }).join('');
}
function itemHTML(it,q,showLoc){
  const loc=showLoc&&node(it.nodeId)?`<a href="#" class="truncate" style="color:var(--acc)" onclick="select('${it.nodeId}');return false">${esc(pathOf(it.nodeId).join(' / '))}</a>`:'';
  const time=new Date(it.created).toLocaleString([],{dateStyle:'medium',timeStyle:'short'});
  let body='',acts='';
  if(it.type==='text'){body=md(it.text,q);acts=`<button class="btn" onclick="copyText('${it.id}')">Copy</button><button class="btn" onclick="editItem('${it.id}')">Edit</button>`}
  else if(it.type==='check'){
    body=it.tasks.map((t,i)=>`<label class="flex gap-2 items-start py-1 cursor-pointer"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${it.id}',${i})" class="mt-1" style="accent-color:var(--acc);width:16px;height:16px"><span style="${t.done?'text-decoration:line-through;color:var(--mute)':''}">${hl(esc(t.t),q)}</span></label>`).join('');
    body+=`<div class="text-xs mt-1" style="color:var(--mute)">${it.tasks.filter(t=>t.done).length}/${it.tasks.length} done</div>`;
  }else{
    const icon=it.mime.startsWith('image/')?'🖼':it.mime==='application/pdf'?'📕':'📄';
    body=`<div class="flex items-center gap-3"><span style="font-size:24px">${icon}</span><div class="min-w-0"><div class="truncate font-medium">${hl(esc(it.name),q)}</div><div class="text-xs" style="color:var(--mute)">${fmtSize(it.size)} · ${esc(it.mime)}</div></div></div>`;
    if(it.mime.startsWith('image/'))body+=`<img data-blob="${it.blobId}" class="mt-2 rounded-md max-h-64" alt="">`;
    acts=`<button class="btn" onclick="openFile('${it.id}')">Preview</button><button class="btn" onclick="dlFile('${it.id}')">Download</button>`;
  }
  return `<article class="panel rounded-lg p-3"><div class="flex items-center gap-2 mb-2 text-xs" style="color:var(--mute)"><span style="white-space:nowrap">${time}</span>${loc}<span class="ml-auto flex gap-1">${acts}<button class="btn" onclick="delItem('${it.id}')" aria-label="Delete">✕</button></span></div>${body}</article>`;
}
const GLYPH=['■','●','○'];
function rowsHTML(pid,depth){
  return kids(pid).map(n=>{
    const k=kids(n.id),open=S.open[n.id],on=n.id===S.sel&&!S.query.trim();
    return `<div class="nav ${on?'on':''}" style="padding-left:${6+depth*16}px;${depth===0?'color:var(--text);font-weight:600':''}" onclick="select('${n.id}')">`+
      `<span style="width:16px;text-align:center;font-size:11px" onclick="event.stopPropagation();S.open['${n.id}']=!S.open['${n.id}'];renderTree()">${k.length?(open?'▾':'▸'):''}</span>`+
      `<span style="font-size:9px;color:var(--acc)">${GLYPH[Math.min(depth,2)]}</span><span class="truncate">${esc(n.name)}</span>`+
      `<span class="x" onclick="event.stopPropagation();addNode('${n.id}')" title="Add sub-branch">＋</span>`+
      `<span class="x" style="margin-left:4px" onclick="event.stopPropagation();renameNode('${n.id}')" title="Rename">✎</span>`+
      `<span class="x" style="margin-left:4px" onclick="event.stopPropagation();delNode('${n.id}')" title="Delete">🗑</span></div>`+
      (open&&k.length?rowsHTML(n.id,depth+1):'');
  }).join('');
}
function renderTree(){
  $('tree').innerHTML=S.nodes.length?rowsHTML(null,0):'<div class="p-3 text-sm" style="color:var(--mute)">Nothing here yet. Tap “+ Block” to add your first top-level branch.</div>';
}
function render(scroll){
  renderTree();renderComposer();
  const feed=$('feed'),q=S.query.trim(),hdr=$('hdr');
  hdr.innerHTML='';
  if(q){
    $('title').textContent=`Search: "${q}"`;
    const lq=q.toLowerCase();
    const hits=S.items.filter(it=>it.type==='text'?it.text.toLowerCase().includes(lq):it.type==='file'?it.name.toLowerCase().includes(lq):it.tasks.some(t=>t.t.toLowerCase().includes(lq)));
    feed.innerHTML=hits.length?hits.map(i=>itemHTML(i,q,true)).join(''):'<div style="color:var(--mute)">No matches in any branch.</div>';
  }else if(!S.sel||!node(S.sel)){
    S.sel=null;$('title').textContent='DevVault';
    feed.innerHTML=S.nodes.length?'<div style="color:var(--mute)">Pick a branch from the sidebar.</div>':
      `<div class="panel rounded-lg p-4 max-w-md"><b>Welcome to DevVault</b><p class="mt-2" style="color:var(--mute)">Build your own tree: blocks (like YouTube, Games, Study) with branches inside them, as deep as you like. Every branch can hold prompts, notes, checklists and files, and every name can be renamed anytime. All data stays on this device.</p><button class="btn btn-acc mt-3" onclick="addNode(null)">Add first block</button></div>`;
  }else{
    const n=node(S.sel);
    $('title').innerHTML=pathOf(n.id).map(esc).join(' <span style="color:var(--mute)">/</span> ');
    hdr.innerHTML=`<button class="btn" onclick="addNode('${n.id}')">＋ Branch</button><button class="btn" onclick="renameNode('${n.id}')">Rename</button>`;
    const its=S.items.filter(i=>i.nodeId===S.sel),sub=kids(n.id);
    let h='';
    if(sub.length)h+=`<div class="flex gap-2" style="flex-wrap:wrap">${sub.map(s=>`<button class="btn" onclick="select('${s.id}')">${GLYPH[Math.min(pathOf(s.id).length-1,2)]} ${esc(s.name)}</button>`).join('')}</div>`;
    h+=its.length?its.map(i=>itemHTML(i)).join(''):'<div style="color:var(--mute)">Empty. Add text or a checklist below, or drop a file.</div>';
    feed.innerHTML=h;
  }
  feed.querySelectorAll('img[data-blob]').forEach(async im=>{const b=await DB.get('blobs',im.dataset.blob);if(b)im.src=URL.createObjectURL(b.blob)});
  if(scroll)feed.scrollTop=feed.scrollHeight;
}
function onSearch(v){S.query=v;render()}

/* ---------- Backup ---------- */
function blobToB64(b){return new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)})}
async function exportAll(){
  toast('Preparing backup…');
  const blobs=[];for(const b of await DB.all('blobs'))blobs.push({id:b.id,type:b.blob.type,data:await blobToB64(b.blob)});
  const data={app:'DevVault',version:2,exported:new Date().toISOString(),nodes:S.nodes,items:S.items,blobs};
  const url=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));
  const a=document.createElement('a');a.href=url;a.download=`devvault-backup-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();
  toast('Backup exported');
}
async function importAll(file){
  if(!file)return;
  try{
    const d=JSON.parse(await file.text());
    if(d.app!=='DevVault')throw new Error('Not a DevVault backup');
    if(!confirm('Importing replaces all current data. Continue?'))return;
    let nodes=d.nodes,items=d.items;
    if(!nodes){ // version 1 backup: projects/channels
      nodes=[...d.projects.map(p=>({id:p.id,parentId:null,name:p.name,created:p.created})),...d.channels.map(c=>({id:c.id,parentId:c.projectId,name:c.name,created:c.created}))];
      items=d.items.map(i=>{const o={...i,nodeId:i.channelId};delete o.channelId;delete o.projectId;return o});
    }
    await DB.clear();
    for(const n of nodes)await DB.put('nodes',n);
    for(const i of items)await DB.put('items',i);
    for(const b of d.blobs){const blob=await (await fetch(b.data)).blob();await DB.put('blobs',{id:b.id,blob})}
    S.sel=null;await load();render();toast('Backup restored');
  }catch(e){toast('Import failed: '+e.message)}
}

/* ---------- Init ---------- */
['dragenter','dragover'].forEach(e=>$('feed').addEventListener(e,ev=>{ev.preventDefault();$('feed').classList.add('drop')}));
['dragleave','drop'].forEach(e=>$('feed').addEventListener(e,ev=>{ev.preventDefault();$('feed').classList.remove('drop')}));
$('feed').addEventListener('drop',ev=>{if(ev.dataTransfer&&ev.dataTransfer.files.length)uploadFiles(ev.dataTransfer.files)});
$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();submitItem()}});
(async()=>{
  await DB.init();await migrate();await load();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  render();
})();
</script>
